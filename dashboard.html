<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeadGreen - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#060907] text-white flex items-center justify-center min-h-screen">

  <div class="w-full max-w-md bg-[#0d1310] p-8 rounded-2xl border border-[#1f2d25] shadow-2xl">
    <div class="text-center mb-6">
      <h1 class="text-3xl font-extrabold">Lead<span class="text-[#00e676]">Green</span></h1>
      <p class="text-xs text-slate-400 mt-1">Área Exclusiva de Assinantes</p>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">E-mail</label>
        <input type="email" id="email" required class="w-full bg-[#121a15] border border-[#1f2d25] rounded-xl p-3 text-sm text-white focus:outline-none focus:border-[#00e676]">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Senha</label>
        <input type="password" id="password" required class="w-full bg-[#121a15] border border-[#1f2d25] rounded-xl p-3 text-sm text-white focus:outline-none focus:border-[#00e676]">
      </div>

      <button type="submit" class="w-full py-3 rounded-xl bg-[#00e676] text-black font-extrabold hover:bg-[#00c853] transition-all">
        Entrar na Plataforma
      </button>
    </form>

    <div id="errorMsg" class="mt-4 text-xs text-red-400 text-center hidden"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://acazoliwrnnqfduvveer.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFjYXpvbGl3cm5ucWZkdXZ2ZWVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzOTU0MDcsImV4cCI6MjEwNjk3MTQwN30.0GHx9PYI6UFOhzNXorvoD5RwnrNSdUKGF9XEMFF0r0c";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');

      const { data, error } = await supabaseClient
        .from('clientes')
        .select('*')
        .eq('email', email)
        .eq('senha', password)
        .single();

      if (error || !data) {
        errorMsg.innerText = "E-mail ou senha incorretos.";
        errorMsg.classList.remove('hidden');
        return;
      }

      const hoje = new Date().toISOString().split('T')[0];
      if (data.validade < hoje) {
        errorMsg.innerText = "A sua licença expirou. Entre em contacto para renovar!";
        errorMsg.classList.remove('hidden');
        return;
      }

      localStorage.setItem('usuarioLogado', email);
      window.location.href = "dashboard.html";
    });
  </script>
</body>
</html>
